<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>The Ant Hill — operator console</title>
  <link rel="stylesheet" href="styles.css?v=control-room-5">
</head>
<body>
  <a class="skip-link" href="#main">Skip to agent list</a>

  <header class="masthead">
    <div class="masthead-inner">
      <div class="masthead-scene">
        <span id="nest-beacon" class="beacon" hidden aria-hidden="true"></span>
        <div class="wordmark">
          <h1>The Ant&nbsp;Hill</h1>
          <p class="eyebrow">Live multi-agent control room</p>
        </div>
      </div>
      <p id="conn-badge" class="conn conn-connecting">
        <span class="conn-dot" aria-hidden="true"></span>
        <span id="conn-label">Connecting</span>
      </p>
    </div>
  </header>

  <!-- One status verdict plus a configurable, scan-ordered summary rail. -->
  <section id="health-rail" class="health-rail" aria-label="Fleet health">
    <div class="rail-header">
      <span class="rail-heading">Summary</span>
      <button type="button" class="rail-action" id="customize-summary" aria-expanded="false" aria-controls="widget-customizer">Customize summary</button>
    </div>
    <div id="health-widgets" class="rail-inner"></div>
    <div id="widget-customizer" class="widget-customizer" hidden>
      <div class="widget-customizer-inner">
        <div>
          <h2 id="widget-customizer-title">Customize summary</h2>
          <p class="widget-help">Choose widgets and use the arrow controls to set their order.</p>
        </div>
        <div id="widget-options" class="widget-options" role="list" aria-labelledby="widget-customizer-title"></div>
        <button type="button" class="btn widget-reset" id="widget-reset">Reset defaults</button>
      </div>
    </div>
  </section>

  <!-- Active interventions span the full canvas above the workboard/inspector split. -->
  <section id="interventions" class="interventions signal-band" aria-labelledby="interventions-title" hidden>
    <div class="signal-head">
      <h2 id="interventions-title" class="section-title">Interventions</h2>
      <span id="interventions-count" class="signal-count" aria-live="polite"></span>
      <button type="button" class="signal-toggle" id="interventions-toggle" aria-controls="interventions-list" aria-expanded="true" data-fkey="signal-toggle:interventions">Subdue</button>
    </div>
    <ul id="interventions-list" class="signal-list"></ul>
    <button type="button" class="signal-subdued" id="interventions-subdued" hidden data-fkey="signal-expand:interventions">Show interventions</button>
  </section>

  <div class="app-body">
    <main id="main" class="pane-list" tabindex="-1">
      <section id="warnings" class="warnings" aria-labelledby="warnings-title" hidden>
        <div class="signal-head">
          <h2 id="warnings-title" class="section-title">Advisories</h2>
          <span id="warnings-count" class="signal-count" aria-live="polite"></span>
          <button type="button" class="signal-toggle" id="warnings-toggle" aria-controls="warnings-list" aria-expanded="true" data-fkey="signal-toggle:advisories">Subdue</button>
        </div>
        <ul id="warnings-list" class="signal-list"></ul>
        <button type="button" class="signal-subdued" id="warnings-subdued" hidden data-fkey="signal-expand:advisories">Show advisories</button>
      </section>

      <section class="toolbar" aria-label="Views, search, and selection">
        <nav class="views" role="group" aria-label="View" id="views">
          <button type="button" class="view-tab" data-view="now" aria-pressed="true">Now<span class="count" id="count-now"></span></button>
          <button type="button" class="view-tab" data-view="needs-you" aria-pressed="false">Alerts<span class="count" id="count-needs-you"></span></button>
          <button type="button" class="view-tab" data-view="working" aria-pressed="false">Working<span class="count" id="count-working"></span></button>
          <button type="button" class="view-tab" data-view="idle" aria-pressed="false">Idle<span class="count" id="count-idle"></span></button>
          <button type="button" class="view-tab" data-view="history" aria-pressed="false">History<span class="count" id="count-history"></span></button>
        </nav>
        <div class="filter-bar" id="filter-bar" aria-label="Filters" hidden aria-hidden="true"></div>
        <div class="toolbar-row">
          <div class="search-wrap">
            <label class="visually-hidden" for="search">Search agents by name, task, program, provider, model, role, status, directory, or result</label>
            <input id="search" type="search" placeholder="Search agents, tasks, programs…" autocomplete="off">
          </div>
          <button type="button" class="btn select-toggle" id="select-toggle" aria-pressed="false">Select</button>
        </div>
        <p id="scope-note" class="scope-note" aria-live="polite"></p>
      </section>

      <section id="programs" class="programs" aria-label="Programs and agents"></section>

      <div id="empty-state" class="empty-state" hidden>
        <svg class="empty-mound" viewBox="0 0 200 60" aria-hidden="true" focusable="false">
          <path d="M8,50 C36,44 58,54 86,49" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="0.5 7"></path>
          <path d="M70,50 C92,26 118,14 140,14 C162,14 188,26 200,50 Z" fill="currentColor" opacity="0.12"></path>
          <path d="M70,50 C92,26 118,14 140,14 C162,14 188,26 200,50" fill="none" stroke="currentColor" stroke-width="1.6"></path>
          <ellipse cx="140" cy="45" rx="7" ry="3.4" fill="currentColor" opacity="0.5"></ellipse>
        </svg>
        <p id="empty-message">The colony is still.</p>
        <p id="empty-hint" class="empty-hint"></p>
        <button type="button" class="btn" id="empty-retry" hidden>Retry connection</button>
      </div>
    </main>

    <aside id="inspector" class="pane-inspector" aria-label="Agent inspector" hidden></aside>
  </div>

  <div id="broadcast-bar" class="broadcast-bar" hidden aria-live="polite"></div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="app.js?v=control-room-5"></script>
</body>
</html>
