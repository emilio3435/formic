<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Formic — operator console</title>
  <link rel="icon" href="favicon.svg?v=ah-t36">
  <link rel="stylesheet" href="formic-tokens.css?v=ah-t36">
  <link rel="stylesheet" href="styles.css?v=ah-t36">
</head>
<body>
  <a class="skip-link" href="#main">Skip to agent list</a>

  <header class="masthead">
    <div class="masthead-inner">
      <div class="masthead-scene">
        <span id="nest-beacon" class="beacon" hidden aria-hidden="true"></span>
        <img class="formic-mark" src="icons/formic-mark.svg" alt="" aria-hidden="true">
        <div class="wordmark">
          <h1>Form<span class="wm-accent">i</span>c</h1>
          <!-- Audit §21: the masthead spent its resting state on branding, which is
               not one of the three things a pixel is allowed to do here. The
               tagline keeps its accessible name so the page still announces what
               it is; it just stops occupying a row of the calmest screen. -->
          <p class="eyebrow visually-hidden">Live multi-agent control room</p>
        </div>
      </div>
      <!-- The masthead's compact summary face. Static and hidden by default:
           renderHealthRail paints it from the SAME model/data derivation as the
           expanded rail whenever the operator collapses the header, so the two
           faces cannot disagree. Between the scene and the signals, so the
           collapsed row reads identity → readings → controls. -->
      <div id="compact-summary" class="compact-summary" role="group" aria-label="Fleet summary, compact" hidden></div>
      <div class="masthead-signals">
        <!-- Disclosure stays here, first, in both modes. Moving it on collapse
             made the chevron jump across the ribbon. -->
        <button type="button" class="btn masthead-icon header-summary-toggle" id="header-summary-toggle" data-fkey="header-summary-toggle" aria-expanded="true" aria-controls="health-rail compact-summary" aria-label="Collapse header" title="Collapse header"></button>
        <!-- Opt-in out-of-page alerts. Permission is requested from this click
             and nowhere else — never on load. -->
        <button type="button" class="btn masthead-icon notify-toggle" id="notify-toggle" aria-expanded="false" aria-controls="notifications-panel" aria-label="Notifications" title="What needs a person right now."></button>
        <!-- Attention lives here. The header above the board is confidence and
             never links; this is the one place a discrete thing that needs a
             person is named, with its evidence and a route to it. Anchored to
             the signals row's right edge rather than to the button, so a 452px
             panel cannot push past the viewport on a narrow window. -->
        <!-- role="group" is load-bearing, not decoration. A bare <div> computes
             as role=generic, where ARIA PROHIBITS an accessible name — so the
             aria-labelledby that used to sit here named nothing a screen reader
             would enter, measured as `role: generic, name: "4 agents stopped"`
             in the AX tree. group is the same answer this panel's own instrument
             block already uses one level down.

             A static label rather than the <h2>: that heading reads "4 agents
             stopped" and changes on every paint, and a container whose NAME
             churns is re-announced for no reason. The h2 stays as the panel's
             heading; it just no longer doubles as the container's name. -->
        <div id="notifications-panel" class="notify-panel" hidden role="group" aria-label="Notifications"></div>
        <!-- The board's timing thresholds, which decide what every session on
             it is called. They were compiled-in constants; an operator running
             overnight swarms had no way to say "45 minutes of silence is normal
             here" except to edit source. -->
        <button type="button" class="btn masthead-icon settings-toggle" id="settings-toggle" aria-expanded="false" aria-controls="settings-panel" aria-label="Settings" title="Settings"></button>
      </div>
    </div>
  </header>

  <div id="settings-panel" class="settings-panel" hidden aria-labelledby="settings-panel-title"></div>

  <!-- Staleness alarm. Sits in the reading path between the masthead and the
       summary so a frozen feed cannot be missed by not looking at a badge. -->
  <div id="feed-alarm" class="feed-alarm" role="alert" hidden></div>

  <!-- The Clean up sweep's only non-visual signal. Static and outside the
       collapsible rail: it must already exist before its text changes, survive
       every readings paint, and remain in the accessibility tree while the
       compact header hides #health-rail. -->
  <span id="cleanup-status" class="visually-hidden" role="status" aria-live="polite"></span>

  <!-- One status verdict plus a configurable, scan-ordered summary rail.
       Static two-child ribbon: TL;DR lane (60%) + readings stack (40%). -->
  <section id="health-rail" class="health-rail" aria-label="Fleet health">
    <div id="health-widgets" class="rail-inner">
      <div id="health-tldr-lane" class="health-tldr-lane" role="group" aria-label="Cluster TL;DR" hidden></div>
      <div class="readings-stack">
        <div class="stack-head">
          <span class="rail-heading">Summary</span>
          <!-- S2-T3. The board states its scan window ONCE, here, because every
               reading below is an aggregate over the sessions that window contains.
               It sits with the readings rather than under the toolbar: the toolbar's
               line is about the operator's own filter, which is a different window,
               and mixing a stable board-wide fact into a volatile filter line makes
               the stable fact inherit the volatility. -->
          <span id="scan-window" class="scan-window" hidden></span>
          <button type="button" class="rail-action" id="customize-summary" aria-expanded="false" aria-controls="widget-customizer">Customize summary</button>
        </div>
        <div id="readings-grid" class="readings-grid"></div>
      </div>
    </div>
    <div id="widget-customizer" class="widget-customizer" hidden>
      <div class="widget-customizer-inner">
        <div>
          <h2 id="widget-customizer-title">Customize summary</h2>
          <p class="widget-help">Choose widgets and use the arrow controls to set their order.</p>
        </div>
        <div id="widget-options" class="widget-options" role="list" aria-labelledby="widget-customizer-title"></div>
        <button type="button" class="btn widget-reset" id="widget-reset">Reset defaults</button>
      </div>
    </div>
  </section>

  <div class="app-body">
    <div class="ops-stage">
      <main id="main" class="pane-list" tabindex="-1">
        <section class="toolbar" aria-label="Views, search, and selection">
          <nav class="views" role="group" aria-label="View" id="views">
            <button type="button" class="view-tab is-current" data-view="board" aria-pressed="true">Board<span class="count" id="count-board"></span></button>
            <button type="button" class="view-tab" data-view="history" aria-pressed="false">History<span class="count" id="count-history"></span></button>
            <button type="button" class="view-tab" data-view="usage" aria-pressed="false">Usage</button>
            <p id="conn-badge" class="conn conn-connecting">
              <span class="conn-dot" aria-hidden="true"></span>
              <span id="conn-label">Connecting</span>
            </p>
            <!-- The server's OWN health verdict from /api/health, distinct from
                 the connection badge beside it (which reports this browser's
                 SSE view). Silent while the two agree; only speaks when the
                 server disowns its own snapshot or stops answering. -->
            <span id="server-health" class="server-health" hidden></span>
          </nav>
          <!-- FE-4 D4: the reconciling sentence lives IN the filter bar row, after
               the lenses and before the right-aligned working-set control — lenses
               narrow within a population, Time decides what the population is, and
               this reconciles the two numbers, so it stands between them.

               It is declared here rather than built by renderFilterBar because the
               bar is torn down on every paint and an aria-live region that is
               destroyed and recreated announces nothing: the region has to already
               be in the tree when its content changes. renderFilterBar empties the
               bar AROUND it. -->
          <div class="filter-bar" id="filter-bar" aria-label="Filters" hidden aria-hidden="true">
            <p id="bar-scope-note" class="scope-note is-inline" aria-live="polite" hidden></p>
          </div>
          <div class="toolbar-row" id="ops-toolbar-row">
            <div class="search-wrap">
              <label class="visually-hidden" for="search">Search agents by name, task, program, provider, model, role, status, directory, or result</label>
              <!-- Audit §16: the old placeholder measured 389px inside a 333px input
                   once the drawer docked, so the field list it enumerated was
                   unreadable exactly when the box was smallest. The list is not
                   deleted, it moves to the title where it does not compete. -->
              <input id="search" type="search" placeholder="Search agents…  /" title="Searches name, model, cwd, provider, role, status and session id. Press / to focus." autocomplete="off">
            </div>
          </div>
          <p id="scope-note" class="scope-note" aria-live="polite"></p>
        </section>

        <!-- First-paint placeholder. Deliberately NOT hidden in the markup: the
             client is a deferred module and boot() does not paint until the
             first /api/snapshot resolves, so the board sat blank until then.
             This shows the shape of the board immediately, before app.js runs,
             and the client hides it the moment the first snapshot lands — or
             fails, which is #empty-state's job to explain. -->
        <div id="board-skeleton" class="board-skeleton" role="status" aria-label="Loading agents">
          <span class="visually-hidden">Loading agents…</span>
          <div class="sk-head" aria-hidden="true"></div>
          <div class="sk-row" aria-hidden="true"><span class="sk-bar sk-name"></span><span class="sk-bar sk-meta"></span></div>
          <div class="sk-row" aria-hidden="true"><span class="sk-bar sk-name"></span><span class="sk-bar sk-meta"></span></div>
          <div class="sk-row" aria-hidden="true"><span class="sk-bar sk-name"></span><span class="sk-bar sk-meta"></span></div>
          <div class="sk-head" aria-hidden="true"></div>
          <div class="sk-row" aria-hidden="true"><span class="sk-bar sk-name"></span><span class="sk-bar sk-meta"></span></div>
          <div class="sk-row" aria-hidden="true"><span class="sk-bar sk-name"></span><span class="sk-bar sk-meta"></span></div>
        </div>

        <section id="programs" class="programs" aria-label="Programs and agents"></section>
        <section id="usage-panel" class="usage-panel" aria-label="BurnBar usage" hidden></section>

        <div id="empty-state" class="empty-state" hidden>
          <svg class="empty-mound" viewBox="0 0 200 60" aria-hidden="true" focusable="false">
            <path d="M8,50 C36,44 58,54 86,49" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="0.5 7"></path>
            <path d="M70,50 C92,26 118,14 140,14 C162,14 188,26 200,50 Z" fill="currentColor" opacity="0.12"></path>
            <path d="M70,50 C92,26 118,14 140,14 C162,14 188,26 200,50" fill="none" stroke="currentColor" stroke-width="1.6"></path>
            <ellipse cx="140" cy="45" rx="7" ry="3.4" fill="currentColor" opacity="0.5"></ellipse>
          </svg>
          <p id="empty-message">The colony is still.</p>
          <p id="empty-hint" class="empty-hint"></p>
          <!-- Proof of life for the day-one board. An operator on first run
               cannot tell "watching, found nothing" from "not watching", and
               those are the two states an empty cockpit is ambiguous between.
               The collector count and a ticking snapshot age are evidence a
               stalled client cannot produce. -->
          <p id="empty-proof" class="empty-proof" hidden></p>
          <button type="button" class="btn" id="empty-retry" hidden>Retry connection</button>
        </div>
      </main>

    </div>
    <aside id="inspector" class="pane-inspector" aria-label="Agent inspector" hidden></aside>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="app.js?v=ah-t36"></script>
</body>
</html>
